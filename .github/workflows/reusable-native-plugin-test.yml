name: Native Plugin Test

permissions: {}

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  run:
    name: Native Plugin (${{ inputs.os }})
    runs-on: ${{ inputs.os == 'ubuntu-latest' && 'namespace-profile-linux-x64-default' || inputs.os == 'macos-latest' && 'namespace-profile-mac-default' || inputs.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        if: runner.os == 'Windows'
        with:
          drive-size: 12GB
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
            PNPM_HOME,{{ DEV_DRIVE }}/.pnpm

      - name: Setup Rust
        uses: oxc-project/setup-rust@12a52e3caf7bac9d8b9ca550a82c425ed6343aee # v1.0.18
        with:
          cache-key: native-plugin-${{ inputs.os }}
          save-cache: ${{ github.ref_name == 'main' }}
          target-dir: ${{ runner.os == 'Windows' && format('{0}/target', env.DEV_DRIVE) || '' }}

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: '1.7.0'
          node-version: 24
          cache: true

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: examples/native-plugin/foreign/go/go.mod
          cache: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Download Native Rolldown Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rolldown-native-${{ inputs.os }}
          path: packages/rolldown/dist

      - name: Test Rust ABI and loader
        run: cargo test -p rolldown_plugin_native_abi -p rolldown_plugin_native

      - name: Build Rust plugin
        run: cargo build --manifest-path examples/native-plugin/plugin/Cargo.toml --release

      - name: Bundle with Rust plugin
        working-directory: examples/native-plugin
        run: node ../../packages/rolldown/bin/cli.mjs -c

      - name: Verify Rust plugin output
        run: node examples/native-plugin/verify.mjs

      - name: Configure foreign plugins
        run: cmake -S examples/native-plugin/foreign -B examples/native-plugin/foreign/build -DCMAKE_BUILD_TYPE=Release

      - name: Build foreign plugins
        run: cmake --build examples/native-plugin/foreign/build --config Release --parallel

      - name: Test C, C++, Go, and Zig plugins
        run: node examples/native-plugin/conformance.mjs
